<header class="h-14 border-b border-gray-200 bg-white flex items-center justify-between px-4 md:px-6 flex-shrink-0">
  <div class="flex items-center gap-3">
    <!-- Hamburger (mobile only) -->
    <button (click)="onMenuToggle()" class="lg:hidden p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <span class="text-sm text-gray-400">Tableau de bord</span>
  </div>

  <div class="flex items-center gap-3">
    <!-- Notifications -->
    <button class="relative p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-md transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
      <span class="absolute top-1 right-1 w-1.5 h-1.5 bg-primary-500 rounded-full"></span>
    </button>
    <!-- Status -->
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-primary-500"></span>
      <span class="text-xs text-gray-400 hidden sm:inline">En ligne</span>
    </div>
  </div>
</header>
