<div>
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Nouvelle Commande</h1>
      <p class="text-sm text-gray-500 mt-1">Créer une commande fournisseur</p>
    </div>
    <button (click)="goBack()" class="btn-secondary">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Retour
    </button>
  </div>

  @if (error$ | async; as errorMsg) {
    <div class="flex items-center gap-2 px-3 py-2 mb-4 bg-red-50 border border-red-200 rounded-md">
      <span class="text-sm text-red-700">{{ errorMsg }}</span>
    </div>
  }

  <div class="card p-6">
    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Fournisseur</label>
          <select formControlName="supplierId" class="input">
            <option [ngValue]="null" disabled>Sélectionner un fournisseur</option>
            @for (supplier of suppliers$ | async; track supplier.id) {
              <option [ngValue]="supplier.id">{{ supplier.companyName }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Date de Commande</label>
          <input formControlName="orderDate" type="date" class="input" />
        </div>
      </div>

      <!-- Items -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <label class="text-sm font-medium text-gray-600">Articles</label>
          <button type="button" (click)="addItem()" class="btn-ghost text-primary-600 text-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Ajouter
          </button>
        </div>
        <div formArrayName="items" class="space-y-3">
          @for (item of items.controls; track $index; let i = $index) {
            <div [formGroupName]="i" class="grid grid-cols-12 gap-3 items-end p-3 bg-gray-50 rounded-md">
              <div class="col-span-5">
                <label class="block text-xs font-medium text-gray-500 mb-1">Produit</label>
                <select formControlName="productId" class="input text-sm">
                  <option [ngValue]="null" disabled>Choisir...</option>
                  @for (product of products$ | async; track product.id) {
                    <option [ngValue]="product.id">{{ product.reference }} — {{ product.name }}</option>
                  }
                </select>
              </div>
              <div class="col-span-3">
                <label class="block text-xs font-medium text-gray-500 mb-1">Quantité</label>
                <input formControlName="quantity" type="number" min="1" class="input text-sm" />
              </div>
              <div class="col-span-3">
                <label class="block text-xs font-medium text-gray-500 mb-1">Prix Unitaire</label>
                <input formControlName="unitPrice" type="number" step="0.01" class="input text-sm" />
              </div>
              <div class="col-span-1 flex justify-center">
                @if (items.length > 1) {
                  <button type="button" (click)="removeItem(i)" class="p-1 text-red-400 hover:text-red-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                  </button>
                }
              </div>
            </div>
          }
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
        <button type="button" (click)="goBack()" class="btn-secondary">Annuler</button>
        <button type="submit" [disabled]="orderForm.invalid || (loading$ | async)" class="btn-primary">
          Créer la Commande
        </button>
      </div>
    </form>
  </div>
</div>
