<div>
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">{{ isEditMode ? 'Modifier' : 'Nouveau' }} Produit</h1>
      <p class="text-sm text-gray-500 mt-1">{{ isEditMode ? "Modifier les informations du produit" : "Ajouter un nouveau produit au catalogue" }}</p>
    </div>
    <button (click)="goBack()" class="btn-secondary">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Retour
    </button>
  </div>

  @if (error$ | async; as errorMsg) {
    <div class="flex items-center gap-2 px-3 py-2 mb-4 bg-red-50 border border-red-200 rounded-md">
      <span class="text-sm text-red-700">{{ errorMsg }}</span>
    </div>
  }

  <div class="card p-6">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Référence</label>
          <input formControlName="reference" class="input" placeholder="Ex: REF-001" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Nom</label>
          <input formControlName="name" class="input" placeholder="Ex: Chemise Professionnelle" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Catégorie</label>
          <input formControlName="category" class="input" placeholder="Ex: VETEMENTS" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Prix Unitaire (MAD)</label>
          <input formControlName="unitPrice" type="number" step="0.01" class="input" placeholder="0.00" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Seuil d'Alerte</label>
          <input formControlName="reorderPoint" type="number" class="input" placeholder="50" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Unité</label>
          <input formControlName="unit" class="input" placeholder="Ex: PIECE, KG" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1.5">Description</label>
        <textarea formControlName="description" rows="3" class="input" placeholder="Description du produit..."></textarea>
      </div>
      <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
        <button type="button" (click)="goBack()" class="btn-secondary">Annuler</button>
        <button type="submit" [disabled]="productForm.invalid || (loading$ | async)" class="btn-primary">
          {{ isEditMode ? 'Mettre à Jour' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
